# Referência da configuração do painel (noriasync.com.br). O serviço é configurado no painel do Render,
# que publica automaticamente a cada push no branch dev. Mantenha este arquivo igual ao que está configurado lá.
services:
  - type: static
    name: magia-app
    runtime: static
    branch: dev
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_TENANT_SLUG
        value: jiw
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_N8N_BASE_URL
        sync: false
