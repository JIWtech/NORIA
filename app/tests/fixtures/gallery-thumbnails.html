<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeria de teste NORIA</title><div id="root"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {MediaViewer} from '/src/features/conversations/components/MediaViewer.jsx';import {enrichMediaUrls} from '/src/services/media/mediaUrlService.js';import '/src/styles/components/media-viewer.css';
const urls=[];for(let i=0;i<5;i++){const c=document.createElement('canvas');c.width=640;c.height=420;const x=c.getContext('2d');x.fillStyle=['#2c6377','#9b532f','#326546','#644c83','#94702c'][i];x.fillRect(0,0,640,420);x.fillStyle='white';x.font='42px Arial';x.fillText('Foto '+(i+1),45,90);x.font='22px Arial';x.fillText('Teste da galeria',45,135);urls.push(await new Promise(r=>c.toBlob(b=>r(URL.createObjectURL(b)),'image/png')))}
const events=urls.map((url,i)=>({id:String(i),direction:'inbound',raw_payload:{media:{kind:'image',status:'stored',verified:true,bucket:'channel-media',storagePath:'teste/foto-'+i+'.png'}}}));await enrichMediaUrls(events,{storage:{from:()=>({createSignedUrl:async path=>({data:{signedUrl:urls[Number(path.match(/foto-(\d+)/)[1])]},error:null})})}});
const gallery=events.map((e,i)=>({id:e.id,kind:'image',bucket:e.raw_payload.media.bucket,storagePath:e.raw_payload.media.storagePath,alt:'Foto '+(i+1)}));const root=createRoot(document.getElementById('root'));root.render(React.createElement(MediaViewer,{src:urls[0],gallery,onClose:()=>root.render(React.createElement('p',null,'Visualizador fechado'))}));
</script></html>
